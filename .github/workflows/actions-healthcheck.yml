name: Actions Healthcheck

on:
  push:
    branches:
      - main
    paths:
      - "actions-healthcheck-trigger.txt"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record success
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > actions-healthcheck-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions-healthcheck-success.txt
          git commit -m "chore: record Actions healthcheck [skip ci]"
          git push

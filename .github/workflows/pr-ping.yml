name: PR Ping

on:
  pull_request:

permissions:
  issues: write
  pull-requests: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Comment run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "PR workflow active. Run ID: $GITHUB_RUN_ID; Head SHA: $GITHUB_SHA"

name: Branch Healthcheck

on:
  push:
    branches:
      - peyk-apk-build-20260727
    paths:
      - "peyk-build/branch-healthcheck-trigger.txt"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record success
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > peyk-build/branch-healthcheck-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peyk-build/branch-healthcheck-success.txt
          git commit -m "chore: record branch Actions healthcheck [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

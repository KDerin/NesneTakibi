name: RobotSepeti Peyk APK Build

on:
  push:
    branches:
      - peyk-apk-build-20260727
    paths:
      - "peyk-build/parts/**"
      - ".github/workflows/peyk-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and sign APKs
        id: build
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0"

            rm -rf build-work
            mkdir -p build-work/project
            cat peyk-build/parts/part-*.b64 | base64 --decode > build-work/RobotSepetiPeyk-v2.3.0-source.zip
            echo "b54d539b298c885d14d5ef39c5db74867d7fef5fcbf002be8f943e1a64511c3f  build-work/RobotSepetiPeyk-v2.3.0-source.zip" | sha256sum -c -
            unzip -q build-work/RobotSepetiPeyk-v2.3.0-source.zip -d build-work/project
            cd build-work/project

            STORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore robotsepeti-peyk-release.jks \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias robotsepeti_peyk \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=RobotSepeti, OU=Peyk, O=RobotSepeti, L=Istanbul, ST=Istanbul, C=TR"

            printf 'storeFile=robotsepeti-peyk-release.jks\nstorePassword=%s\nkeyAlias=robotsepeti_peyk\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" > keystore.properties
            printf 'ROBOTSEPETI PEYK ANDROID IMZA BILGILERI\nSurum: 2.3.0\nPaket: com.robotsepeti.peyk\nKeystore: robotsepeti-peyk-release.jks\nAlias: robotsepeti_peyk\nStore password: %s\nKey password: %s\n\nBu dosya ve JKS gelecekteki guncellemeler icin zorunludur.\n' "$STORE_PASSWORD" "$KEY_PASSWORD" > imza-bilgileri.txt

            gradle --no-daemon --stacktrace assembleLanRelease assembleSecureRelease

            mkdir -p TESLIM-APK
            cp app/build/outputs/apk/lan/release/app-lan-release.apk TESLIM-APK/RobotSepeti-Peyk-LAN-v2.3.0.apk
            cp app/build/outputs/apk/secure/release/app-secure-release.apk TESLIM-APK/RobotSepeti-Peyk-HTTPS-v2.3.0.apk
            cp robotsepeti-peyk-release.jks imza-bilgileri.txt TESLIM-APK/

            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" verify --verbose --print-certs TESLIM-APK/RobotSepeti-Peyk-LAN-v2.3.0.apk > TESLIM-APK/LAN-IMZA-DOGRULAMA.txt
            "$APKSIGNER" verify --verbose --print-certs TESLIM-APK/RobotSepeti-Peyk-HTTPS-v2.3.0.apk > TESLIM-APK/HTTPS-IMZA-DOGRULAMA.txt
            (cd TESLIM-APK && sha256sum *.apk *.jks > SHA256SUMS.txt)
          } > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload signed APK delivery
        id: apk_artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: RobotSepeti-Peyk-v2.3.0
          path: build-work/project/TESLIM-APK/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostic
        id: log_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RobotSepeti-Peyk-v2.3.0-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish build status
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.build.outputs.exit_code }}
          APK_ARTIFACT_ID: ${{ steps.apk_artifact.outputs.artifact-id }}
          LOG_ARTIFACT_ID: ${{ steps.log_artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [ "${EXIT_CODE:-1}" = "0" ]; then STATUS="success"; else STATUS="failed"; fi
          mkdir -p peyk-build/status
          python - <<'PY'
          import json, os, pathlib
          log = pathlib.Path('build.log')
          tail = ''
          if log.exists():
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-120:])
          data = {
              'status': os.environ.get('STATUS_OVERRIDE') or ('success' if os.environ.get('EXIT_CODE') == '0' else 'failed'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'apk_artifact_id': os.environ.get('APK_ARTIFACT_ID') or None,
              'log_artifact_id': os.environ.get('LOG_ARTIFACT_ID') or None,
              'log_tail': tail,
          }
          pathlib.Path('peyk-build/status/latest.json').write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peyk-build/status/latest.json
          git commit -m "chore: publish Peyk APK build status [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME}
